# energy-watchdog configuration (JHC-504).
#
# Powers p1 down when solar production no longer covers consumption and wakes it back
# up when surplus returns, shedding/restoring its guests around the cycle.

interval: 60s

# true: read everything and LOG the actions it would take, perform none.
# alert: also suppress the noise a down p1 makes, from its real power state - Alertmanager
#        silences and the replication jobs targeting it (see manageReplication below), so a
#        manual shutdown neither alerts nor mails about failed replication. Still moves no
#        guests and never powers the host. Good before WoL is ready.
# false: full operation. Flip here only after a dry-run day looks right.
dryRun: true

metricsAddr: ":9333"

# How long p1 may stay up in a gaming session with no gaming guest running before it is
# powered off. Covers manually waking p1 (the gaming VM won't autostart) so you have time
# to launch one, and rides out GPU-passthrough/VM reboots mid-session. Default 10m.
gamingGrace: 10m

# p1's power belongs to nut-dog: it has to work during an outage, and its shed signal and
# WoL need neither Proxmox nor a second node to relay the packet. This watchdog only states
# what it wants, every tick; nut-dog obeys unless a UPS says otherwise. Omit the block to
# power p1 over Proxmox instead (what local runs against cmd/fakecluster do).
powerAPI:
  url: http://nut-dog.energy.svc.cluster.local:9335
  load: p1 # nut-dog's load name for this node
  # token: injected via POWER_API_TOKEN

prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  # avg_over_time window. The "base level" that stops a kitchen burst from triggering
  # a shutdown.
  window: 30m
  # Surplus (production - consumption), sustained over the window, that must be cleared
  # before waking p1. ~1kW covers p1+p2+p3 spinning up. Also the upper hysteresis edge.
  headroomWatts: 1000
  # Shed once surplus drops below this. 0 = shed when consumption exceeds production.
  # The gap up to headroomWatts is the hysteresis band that prevents flapping.
  shedBelowWatts: 0
  # Don't treat surplus as "wake" unless the battery is at least this charged. Low on
  # purpose: it only needs enough buffer to ride out short cloud cover.
  minBatteryPercent: 20
  # Multiplier to convert the production/consumption metrics to watts, so the *Watts
  # thresholds mean watts. The sonnenbatterie metrics are milliwatts, hence 0.001.
  powerScale: 0.001
  productionMetric: sonnenbatterie_production_mw
  consumptionMetric: sonnenbatterie_consumption_mw
  batteryMetric: sonnenbatterie_user_charge_level_percent

proxmox:
  # The proxy fronts all three nodes, so it stays reachable while p1 is off as long as
  # it routes to another node. Any node manages p1's guests cluster-internally.
  endpoint: https://pve.hla1.jhofer.lan
  # Trust the internal CA (mounted from the jhc-ca image) so TLS verifies properly.
  caCertPath: /etc/ssl/certs/jhc-ca.crt
  insecureSkipVerify: false
  # tokenID / tokenSecret come from PROXMOX_TOKEN_ID / PROXMOX_TOKEN_SECRET (the synced
  # 1Password secret) in-cluster; only set them here for local runs.
  # tokenID: "energy-watchdog@pve!watchdog"
  # tokenSecret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  # Waking is done by the cluster (POST /nodes/<node>/wakeonlan), so the MAC lives on the
  # node itself: pvenode config set -wakeonlan <mac>. Nothing to configure here.
  node: pve-1
  targetNodes: [pve-2, pve-3] # migration destinations, used round-robin
  # Disable the replication jobs that replicate *into* `node` while it is powered down, and
  # re-enable them when it is back, so pve-2/pve-3 stop retrying (and mailing about) runs to a
  # host that is off on purpose. Uses Proxmox's own disable flag - the GUI's "Enabled"
  # checkbox - so the job, its schedule and its replication state survive and re-enabling
  # resumes incrementally. Only jobs the watchdog disabled itself are re-enabled; it marks
  # them with "[energy-watchdog]" in the comment, so one you disabled by hand is left alone.
  # Needs VM.Replicate on the replicated guests. Defaults to true.
  manageReplication: true
  migrateTimeout: 15m
  stopTimeout: 5m
  wakeTimeout: 5m
  # How recently `node` must have booted to count as powered on by hand. Proxmox reports a
  # node that is shutting down as online (its status is only online/offline/unknown), so
  # uptime is what tells a real power-on from one of ours on its way down. Keep it above the
  # uptime the node reports when it first shows up online - cluster join happens well after
  # kernel boot - and below the uptime it has when the watchdog sheds it. Defaults to 5m.
  freshBootWindow: 5m

# Guest classes. Entries are int ids (601) or inclusive ranges ("600-699").
# The three lists must not overlap.
guests:
  migrate: ["100-199"] # live-migrate off p1 before power-off; never migrated back
  # Graceful stop; all of these are started again at good-morning. To keep one down,
  # tag it in Proxmox: qm set <id> --tags en_no-autostart
  stop: ["300-399"]
  gamingGuard: ["600-699"] # any running -> keep p1 up (no power-off)

alertmanager:
  # Every Alertmanager that needs silencing while p1 is down. If p1 hosts guests in more
  # than one cluster, list each cluster's Alertmanager (https endpoints use the same
  # internal CA as proxmox.caCertPath).
  urls:
    - http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  comment: "p1 powered down by energy-watchdog (solar deficit)"
  # How long a silence is left to lapse once p1's node reports up, instead of being dropped
  # the instant it does. The node coming back doesn't mean the guests hosted on it are up too
  # (a Talos cluster takes a while to boot), so this window keeps their alerts suppressed
  # until they've had a chance to come back. Default 15m.
  unsilenceGrace: 15m
  # Each entry is one silence (its matchers are AND-ed). Scope each to p1's own label
  # values so an identical alert firing for another node isn't shadowed.
  silences:
    - matchers:
        - name: node
          value: ".*-p1"
          isRegex: true

state:
  # In-cluster: persisted to this ConfigMap. Locally: the file below is used instead.
  configMapName: energy-watchdog-state
  filePath: /tmp/energy-watchdog-state.json

# Self-service desktop-VM UI (JHC-548). Omit the whole block, or leave addr empty, to
# disable it. The UI never touches p1 itself: it records intent and the reconcile loop
# acts on it, so there is still exactly one owner of p1's power state.
selfService:
  addr: ":8080"
  # Authentik OIDC issuer. The app runs the authorization-code flow against it itself,
  # the same way the rest of the fleet does - no forward-auth proxy in the request path.
  issuerURL: https://auth.jhofer.de/application/o/energy-watchdog/
  clientID: energy-watchdog
  # Usually injected via SELFSERVICE_CLIENT_SECRET / SELFSERVICE_SESSION_KEY, which override
  # whatever is here. sessionKey signs the session cookie; changing it logs everyone out.
  clientSecret: ""
  sessionKey: ""
  # How a browser reaches this UI. The OIDC redirect URI is <externalURL>/auth/callback and
  # must match the one registered on the authentik provider.
  externalURL: https://deskvms.example.lan
  sessionTTL: 12h
  # Groups allowed to hold p1 off regardless of solar surplus (heatwave, maintenance).
  adminGroups: [jhc-admins]
  # Each VM and the authentik groups whose members may start it. Every vmid must fall in
  # guests.gamingGuard, or p1 would be powered off out from under the VM; this is checked
  # at startup.
  vms:
    - vmid: 601
      name: josef-desktop
      groups: [deskvm-josef]
      # Optional: shown with a copy button once the VM is up, to paste into Moonlight.
      # Not a deep link - Moonlight has no URL scheme to launch it with. host:port is fine.
      streamHost: p1.host.hla1.jhofer.lan
